name: Limpiar borradores vacíos

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Simular sin eliminar borradores
        type: boolean
        default: true

permissions: {}

concurrency:
  group: limpiar-borradores
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ejecutar limpieza en el portal
        env:
          ACAV_SITE_URL: ${{ vars.ACAV_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CRON_SECRET" || -z "$ACAV_SITE_URL" ]]; then
            echo 'Configurar el secreto CRON_SECRET y la variable ACAV_SITE_URL en GitHub Actions.' >&2
            exit 1
          fi
          if [[ "$ACAV_SITE_URL" != https://* ]]; then
            echo 'ACAV_SITE_URL debe ser el origen HTTPS de producción.' >&2
            exit 1
          fi
          endpoint="${ACAV_SITE_URL%/}/api/cron/solicitudes/borradores"
          if [[ "$DRY_RUN" == 'true' ]]; then
            endpoint="${endpoint}?dryRun=1"
          fi
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          if ! status="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 120 --retry 2 --retry-delay 5 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --output "$response_file" --write-out '%{http_code}' \
            "$endpoint")"; then
            cat "$response_file"
            exit 1
          fi
          cat "$response_file"
          if [[ "$status" != '200' ]]; then
            echo "Respuesta HTTP inesperada: $status. Revisar el origen de producción; no se siguen redirecciones." >&2
            exit 1
          fi
